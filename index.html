<!DOCTYPE html>
<!--
  ==================================================
  外部LIFFフロントエンド確認用 index.html
  ==================================================

  役割:
  このファイルは「LIFFフロントエンド」です。
  GitHub Pages、Vercel、Firebase Hosting などの静的ホスティング上で動く、
  外部公開された通常のHTMLとして動きます。
  Apps Script の HtmlService で表示される画面ではありません。

  なぜ作るか:
  Apps Script画面では、実際の実行URLが script.googleusercontent.com/userCodeAppPanel
  になる場合があり、LINE Developers の LIFFエンドポイントURLと一致しませんでした。
  その結果 liff.init() が完了しなかったため、画面だけをGitHub Pages側へ移しました。

  設計思想:
  - フロントエンド: LINE userId取得、画面表示、ユーザー操作を担当します。
  - Apps Script: 検証、同日重複防止、特典二重使用防止、スプレッドシート保存を担当します。
  - スプレッドシート: 簡易DB、かつ checkin や benefit_used を積むイベントログです。
  Apps Scriptは画面係ではなく、保存API係に役割を絞りました。
  この分離により、LIFFのエンドポイントURLと実行URLが一致しやすくなり、
  将来フロントだけを作り替える時も影響範囲を小さくできます。

  今回確認すること:
  LIFF が初期化できること、LINE userId を取得できること、
  その userId を使って Apps Script JSONP API へチェックイン保存できることを確認します。

  魔改造の入口:
  次の段階では、+3日判定、特典使用、localStorage本格移植をこの外部フロントへ移します。
  本格運用では、スプレッドシートからDBへ移す、Apps Scriptから別バックエンドへ移す、
  という変更もしやすいように役割を分けています。

  危険ポイント:
  LIFF公式では、liff.init() は LIFF エンドポイントURLと同じURL、
  またはその配下のURLで実行する必要があります。
  GitHub Pages などで公開したURLを、LINE Developers の LIFF エンドポイントURLに設定してください。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The TEA チェックイン</title>

  <!--
    役割:
    LIFF SDKを読み込むための外部scriptです。

    一般化:
    LINEアプリ内ブラウザで liff.init() や liff.getProfile() を使うための部品です。

    魔改造の入口:
    LIFFを使う画面では、このscriptを読み込んだ後に liff.init() を実行します。
  -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    /*
      役割:
      スマホのLINE内ブラウザで読みやすく、押しやすい見た目にします。

      設計思想:
      店頭でお客様とスタッフが同じ画面を見る前提なので、
      ボタンは大きく、状態メッセージは短く明確にします。
      小さな説明文よりも「今どういう状態か」が一目で分かることを優先します。

      魔改造の入口:
      店舗カラーを変えたい場合は、主に --main-color と --background-color を変更します。
      今後のお客様画面ではデバッグカードを非表示にし、必要情報だけに絞ります。
      スタッフ確認用UIとお客様操作UIを分ける場合も、このCSS周辺から見直します。
    */
    :root {
      --background-color: #f6f3ee;
      --main-color: #2f7d5c;
      --text-color: #222222;
      --muted-color: #666666;
      --danger-color: #b3261e;
      --card-color: #ffffff;
      --border-color: #ded6ca;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    .page {
      box-sizing: border-box;
      width: 100%;
      min-height: 100vh;
      padding: 28px 16px 40px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 24px 0 20px;
      color: var(--main-color);
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.25;
      letter-spacing: 0;
      text-align: center;
    }

    .status-card,
    .debug-card {
      box-sizing: border-box;
      width: 100%;
      margin-top: 18px;
      padding: 18px;
      background: var(--card-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    .status-label {
      margin: 0 0 8px;
      color: var(--muted-color);
      font-size: 14px;
      font-weight: 700;
    }

    .status-message {
      margin: 0;
      color: var(--main-color);
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 800;
      line-height: 1.45;
    }

    .status-message.error {
      color: var(--danger-color);
    }

    .action-area {
      margin-top: 22px;
      text-align: center;
    }

    button {
      width: min(88vw, 420px);
      min-height: 64px;
      padding: 18px 24px;
      border: 0;
      border-radius: 14px;
      background: var(--main-color);
      color: #ffffff;
      font-size: clamp(20px, 5.5vw, 26px);
      font-weight: 800;
      line-height: 1.3;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    .note {
      margin: 14px auto 0;
      max-width: 420px;
      color: var(--muted-color);
      font-size: clamp(14px, 3.8vw, 17px);
      line-height: 1.7;
      text-align: left;
    }

    .debug-card h2 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.4;
    }

    .debug-list {
      display: grid;
      gap: 10px;
      margin: 0;
    }

    .debug-row {
      display: grid;
      gap: 4px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee7dd;
    }

    .debug-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .debug-key {
      color: var(--muted-color);
      font-size: 13px;
      font-weight: 700;
    }

    .debug-value {
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .log {
      box-sizing: border-box;
      width: 100%;
      min-height: 120px;
      margin-top: 12px;
      padding: 12px;
      overflow-wrap: anywhere;
      background: #1f2a24;
      color: #f4fff8;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @media (max-width: 480px) {
      .page {
        padding: 24px 14px 36px;
      }

      .status-card,
      .debug-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="app">
      <h1>The TEA チェックイン</h1>

      <section class="status-card" aria-live="polite">
        <p class="status-label">状態</p>
        <p id="statusMessage" class="status-message">起動中</p>
      </section>

      <div class="action-area">
        <button id="checkinButton" type="button">チェックインする</button>
        <p id="checkinNote" class="note">
          LINE userId を取得できたら、Apps Script API へチェックイン保存を送信します。
        </p>
      </div>

      <section class="debug-card">
        <h2>LIFF確認ログ</h2>
        <dl class="debug-list">
          <div class="debug-row">
            <dt class="debug-key">location.href</dt>
            <dd id="locationValue" class="debug-value">確認中</dd>
          </div>
          <div class="debug-row">
            <dt class="debug-key">liff.isInClient()</dt>
            <dd id="isInClientValue" class="debug-value">未確認</dd>
          </div>
          <div class="debug-row">
            <dt class="debug-key">liff.isLoggedIn()</dt>
            <dd id="isLoggedInValue" class="debug-value">未確認</dd>
          </div>
          <div class="debug-row">
            <dt class="debug-key">liff.getOS()</dt>
            <dd id="osValue" class="debug-value">未確認</dd>
          </div>
          <div class="debug-row">
            <dt class="debug-key">liff.getLineVersion()</dt>
            <dd id="lineVersionValue" class="debug-value">未確認</dd>
          </div>
          <div class="debug-row">
            <dt class="debug-key">profile.userId 先頭6文字</dt>
            <dd id="userIdValue" class="debug-value">未取得</dd>
          </div>
          <div class="debug-row">
            <dt class="debug-key">storage key 予定値</dt>
            <dd id="storageKeyValue" class="debug-value">未取得</dd>
          </div>
        </dl>
        <pre id="debugLog" class="log">ログ準備中</pre>
      </section>
    </section>
  </main>

  <script>
    /*
      ==================================================
      設定エリア
      ==================================================

      役割:
      後から変更する可能性が高い値を、画面上部に集めています。

      魔改造の入口:
      LIFFアプリを作り直した場合は LIFF_ID を差し替えます。
      APPS_SCRIPT_API_URL は、Apps Script Webアプリの /exec URL に差し替えます。

      LIFF_ID:
      LINE Developers Console で作成した LIFFアプリのIDです。
      LINEトークで開くURLは https://liff.line.me/{LIFF_ID} です。
      このURLを開くと、LINE Developers 側で設定したエンドポイントURL、
      つまり現在はGitHub PagesのURLが開きます。
      LIFFアプリを作り直した場合はこの値も変わります。
      エンドポイントURLを変えただけでは LIFF_ID 自体は変わりません。

      APPS_SCRIPT_API_URL:
      Apps Script Webアプリの /exec URLを入れます。
      GitHub Pagesから JSONP で呼ぶ保存APIの入口です。
      Apps Scriptを新規デプロイしてURLが変わったら差し替えます。
      同じデプロイを「新バージョンで更新」しただけなら、URLは基本的に維持されます。
      /dev URLではなく、外部公開用の /exec URLを使います。
      Apps Script側の公開設定は「実行ユーザー: 自分」「アクセスできるユーザー: 全員」が必要です。
      ここが仮文字列のままだと保存できません。
    */
    const LIFF_ID = '2010326382-0mJkoibO';
    const APPS_SCRIPT_API_URL = 'https://script.google.com/macros/s/AKfycbxhwJ2sj81NR9X9X-pNOGz6cl65BNkF1JRFHgeqpnybPnM1-N1SxnsCmv20e63UbzGp/exec';
    const CHECKIN_HISTORY_KEY = 'checkinHistory';

    /*
      currentCustomerCode:
      現在操作中のお客様IDです。
      LIFF成功後に liff.getProfile() で取得した LINE userId が入ります。
      createCheckinPayload() で、保存payloadの customer_code として使われます。
      画面上やログでは先頭6文字だけのマスク表示にしますが、
      保存payloadにはフルの LINE userId を入れます。

      危険ポイント:
      LINE userId は個人識別子に近い情報なので、取り扱いに注意します。
      今回は簡易MVPとして「LIFF内で取得した userId を送る」方式です。
      本格運用では ID token または access token をサーバー側で検証します。
    */
    let currentCustomerCode = '';

    const statusMessage = document.getElementById('statusMessage');
    const checkinButton = document.getElementById('checkinButton');
    const checkinNote = document.getElementById('checkinNote');
    const debugLog = document.getElementById('debugLog');
    const locationValue = document.getElementById('locationValue');
    const isInClientValue = document.getElementById('isInClientValue');
    const isLoggedInValue = document.getElementById('isLoggedInValue');
    const osValue = document.getElementById('osValue');
    const lineVersionValue = document.getElementById('lineVersionValue');
    const userIdValue = document.getElementById('userIdValue');
    const storageKeyValue = document.getElementById('storageKeyValue');

    /*
      役割:
      画面上の状態メッセージを更新します。

      一般化:
      アプリが今どの段階にいるかをユーザーに返す「状態表示」です。
    */
    function setStatus(message, isError) {
      statusMessage.textContent = message;
      statusMessage.classList.toggle('error', Boolean(isError));
    }

    /*
      役割:
      デバッグログを追記します。

      なぜ必要か:
      LIFF初期化は複数の段階があるため、どこで止まったかを後から追えるようにします。
      LINE内ブラウザでは通常の開発者コンソールが見づらいため、画面内ログが重要です。
      API疎通、LIFF初期化、payload、responseを画面に出すことで原因を切り分けます。

      危険ポイント:
      userIdはログ上では必ずマスクします。
      店頭本番ではデバッグログは非表示にする候補です。
      本番ではログを最小化し、個人識別子を画面に露出しないようにします。
    */
    function appendLog(message) {
      const currentText = debugLog.textContent === 'ログ準備中' ? '' : debugLog.textContent;
      debugLog.textContent = currentText ? currentText + '\n' + message : message;
    }

    /*
      役割:
      表示用の値を安全に文字へ変換します。

      魔改造の入口:
      表示したくない値が増えた場合は、ここでマスク処理を追加できます。
    */
    function displayValue(value) {
      if (value === undefined) {
        return 'undefined';
      }

      if (value === null) {
        return 'null';
      }

      return String(value);
    }

    /*
      役割:
      LINE userIdを画面表示用に短くします。

      なぜ必要か:
      userIdは個人識別子に近い情報なので、確認画面では先頭6文字だけ表示します。
    */
    function maskUserId(userId) {
      if (!userId) {
        return '未取得';
      }

      return userId.slice(0, 6);
    }

    /*
      役割:
      将来 localStorage に保存する時のキー名を作ります。

      一般化:
      お客様ごとに端末内保存の場所を分けるためのキー設計です。

      今回の確認:
      storage key が checkinHistory:U で始まれば、LINE userIdを使う準備ができています。

      危険ポイント:
      現在は確認画面なので storage key もマスク表示しています。
      本当にlocalStorageへ保存する次段階では、フルの currentCustomerCode を使う必要があります。
      マスク済みIDを保存キー本体に使うと、別ユーザーと衝突するリスクがあります。
      次段階で localStorage を本格移植する時は、
      getStorageKeyForCurrentCustomer() のような別関数を作り、
      表示用のマスクキーと保存用のフルキーを分けると安全です。
    */
    function getPlannedStorageKey() {
      if (!currentCustomerCode) {
        return '未取得';
      }

      return CHECKIN_HISTORY_KEY + ':' + maskUserId(currentCustomerCode);
    }

    /*
      役割:
      JSONP方式で外部APIを呼びます。

      一般化:
      JSONPは、scriptタグを動的に追加して別ドメインAPIを呼ぶ古典的な手法です。
      fetch POST ではCORSで詰まる可能性があるため、このMVPではJSONPを使います。
      JSONPはGET通信なので、REST的には保存操作と相性がきれいではありません。
      ただし、Google Apps Script + GitHub Pages の疎通確認としては簡単で強い方法です。

      魔改造の入口:
      timeoutMilliseconds を変えると、API応答を待つ秒数を変更できます。
      本格運用では、Cloud Run、Firebase Functions、Cloudflare Workers、
      Supabase Edge Functions などの別API基盤も検討できます。

      危険ポイント:
      JSONPでは、レスポンスがJavaScriptとして実行されます。
      そのため、呼び先APIを信用する必要があります。
      callback名は Apps Script 側でも検証します。
      cleanup() は、一時的に作った script タグと window上のcallback関数を消す掃除処理です。
      cleanupしないと、グローバル関数やscriptタグが画面内に溜まります。
      timeoutは、APIが返らない時に永遠に「保存中」で止まらないための保険です。
    */
    function jsonpRequest(url, params, timeoutMilliseconds) {
      return new Promise(function (resolve, reject) {
        const callbackName = 'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const script = document.createElement('script');
        const timeoutId = setTimeout(function () {
          cleanup();
          reject(new Error('JSONPリクエストがタイムアウトしました。'));
        }, timeoutMilliseconds || 10000);

        function cleanup() {
          clearTimeout(timeoutId);
          delete window[callbackName];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = function (response) {
          cleanup();
          resolve(response);
        };

        const query = new URLSearchParams(Object.assign({}, params, {
          callback: callbackName
        }));

        script.src = url + '?' + query.toString();
        script.onerror = function () {
          cleanup();
          reject(new Error('JSONP script の読み込みに失敗しました。'));
        };

        document.body.appendChild(script);
      });
    }

    /*
      役割:
      Apps Script APIへ送るチェックイン保存用データを作ります。

      一般化:
      画面側の状態を、サーバー側が保存できるデータ形式へ変換する処理です。

      魔改造の入口:
      今回は疎通確認なので benefit_status は first_checkin で固定します。
      +3日判定や特典対象判定は次段階で移植します。
      checkin_id は将来 benefit_used と紐づけるために残します。

      設計思想:
      これはGitHub Pages側で作る「保存リクエストの中身」です。
      customer_code は LIFF で取得した LINE userId です。
      action は、今回はチェックインを表す checkin です。
      checkin_id は、この1回のチェックインイベントを識別するIDです。
      後で benefit_used を保存する時、同じ checkin_id を使って紐づけます。
      checkin行を更新せず、benefit_used行を別イベントとして追記する考え方は、
      イベントソーシング的な履歴設計に近いです。

      将来の拡張:
      campaign_id、store_id、benefit_type、liff_version などを足す場合は、
      フロントのpayload、Code.gsのCOLUMNS、createCheckinRow_をセットで確認します。
    */
    function createCheckinPayload() {
      const now = new Date();
      const checkinId = 'checkin_' + now.getTime();

      return {
        customer_code: currentCustomerCode,
        action: 'checkin',
        benefit_status: 'first_checkin',
        used_at: '',
        memo: 'GitHub Pages LIFFフロントからのチェックイン保存テスト。',
        checkin_id: checkinId
      };
    }

    /*
      役割:
      Apps Script JSONP API の疎通確認をします。

      なぜ必要か:
      保存処理で失敗した時に、LIFFの問題なのか、API URLの問題なのかを切り分けやすくします。
      UIは増やしすぎず、結果はログにだけ出します。
    */
    async function pingAppsScriptApi() {
      if (APPS_SCRIPT_API_URL === 'APPS_SCRIPT_API_URL') {
        appendLog('API ping 未実行: APPS_SCRIPT_API_URL を /exec URL に差し替えてください。');
        return;
      }

      try {
        appendLog('API ping 開始');
        const response = await jsonpRequest(APPS_SCRIPT_API_URL, { api: 'ping' }, 10000);
        appendLog('API ping response.ok: ' + displayValue(response.ok));
        appendLog('API ping response.message: ' + displayValue(response.message));
      } catch (error) {
        appendLog('API ping 失敗: ' + displayValue(error.message));
      }
    }

    /*
      役割:
      指定時間が過ぎたらエラーにするPromiseを作ります。

      なぜ必要か:
      LIFF SDK自体は読み込めても、liff.init() が完了しない場合があります。
      永久に「LIFF初期化中」で止まると原因が見えないため、8秒で失敗扱いにします。
    */
    function timeoutAfter(milliseconds, message) {
      return new Promise(function (_, reject) {
        setTimeout(function () {
          reject(new Error(message));
        }, milliseconds);
      });
    }

    /*
      役割:
      LIFFの状態を画面に表示します。

      魔改造の入口:
      保存API接続時に必要な情報を追加したい場合は、この関数に表示項目を足します。
    */
    function showLiffEnvironment() {
      locationValue.textContent = location.href;

      if (typeof liff.isInClient === 'function') {
        isInClientValue.textContent = displayValue(liff.isInClient());
      } else {
        isInClientValue.textContent = 'このLIFF SDKでは使用できません';
      }

      isLoggedInValue.textContent = displayValue(liff.isLoggedIn());

      if (typeof liff.getOS === 'function') {
        osValue.textContent = displayValue(liff.getOS());
      } else {
        osValue.textContent = 'このLIFF SDKでは使用できません';
      }

      if (typeof liff.getLineVersion === 'function') {
        lineVersionValue.textContent = displayValue(liff.getLineVersion());
      } else {
        lineVersionValue.textContent = 'このLIFF SDKでは使用できません';
      }
    }

    /*
      役割:
      エラー内容を画面に出します。

      なぜ必要か:
      liff.init() の失敗理由は、LIFFエンドポイントURL、公開URL、LINEログイン状態などで変わります。
      error.name、error.message、error.stack を出すことで切り分けしやすくします。
    */
    function showError(error) {
      setStatus('LIFF初期化失敗', true);
      appendLog('LIFF初期化失敗');
      appendLog('error.name: ' + displayValue(error.name));
      appendLog('error.message: ' + displayValue(error.message));

      if (error.stack) {
        appendLog('error.stack: ' + error.stack);
      }
    }

    /*
      役割:
      LIFF初期化と LINE userId 取得を行います。

      流れ:
      1. liff.init() を実行する
      2. LINEログイン状態を確認する
      3. 未ログインなら liff.login() へ進む
      4. ログイン済みなら liff.getProfile() で userId を取得する
      5. currentCustomerCode に userId を入れる

      危険ポイント:
      ここでは保存処理をしません。
      保存は、チェックインボタンを押した時に saveCheckinToAppsScriptApi が担当します。
    */
    async function initializeLiffOnlyTest() {
      try {
        setStatus('LIFF初期化中');
        appendLog('起動中');
        appendLog('location.href: ' + location.href);
        appendLog('LIFF_ID: ' + LIFF_ID);
        appendLog('typeof liff: ' + typeof liff);

        if (typeof liff === 'undefined') {
          throw new Error('LIFF SDKが読み込まれていません。');
        }

        appendLog('liff.init 開始');
        await Promise.race([
          liff.init({ liffId: LIFF_ID }),
          timeoutAfter(8000, 'liff.init が8秒以内に完了しませんでした。')
        ]);
        appendLog('liff.init 成功');

        showLiffEnvironment();

        setStatus('LINEログイン確認中');
        appendLog('LINEログイン確認中');

        if (!liff.isLoggedIn()) {
          appendLog('未ログインのため liff.login() を呼びます。');
          setStatus('LINEログインへ移動します');
          liff.login();
          return;
        }

        appendLog('liff.getProfile 開始');
        const profile = await liff.getProfile();

        if (!profile.userId) {
          throw new Error('profile.userId を取得できませんでした。');
        }

        currentCustomerCode = profile.userId;
        userIdValue.textContent = maskUserId(profile.userId);
        storageKeyValue.textContent = getPlannedStorageKey();

        appendLog('liff.getProfile 成功');
        appendLog('profile.userId 先頭6文字: ' + maskUserId(profile.userId));
        appendLog('storage key 予定値: ' + getPlannedStorageKey());

        setStatus('LINE userId 取得成功');
        pingAppsScriptApi();
      } catch (error) {
        showError(error);
      }
    }

    /*
      役割:
      チェックインボタンを押した時に、Apps Script JSONP APIへ保存します。

      一般化:
      画面側で作ったpayloadを、外部APIへ送信する処理です。
      チェックインボタン押下時のアプリケーション制御をまとめています。
      userId取得済みか確認し、API URLが設定済みか確認し、payloadを作り、
      JSONPで送信し、response.ok に応じて画面表示を変えます。

      魔改造の入口:
      今回は疎通確認なので benefit_status は first_checkin 固定です。
      +3日判定やlocalStorage保存は次段階でここに統合します。
      後で、保存成功時のlocalStorage更新、特典ボタン表示、+3日判定をここに統合していきます。

      危険ポイント:
      画面側から送る customer_code は、本格運用ではサーバー側検証が必要です。
      今回はLIFF userId取得済みの状態から、保存APIへ届くかだけを確認します。
      ALREADY_CHECKED_IN_TODAY は業務上の正常ブロックであり、通信エラーではありません。
      その他のエラーでは再試行できるようにボタンを戻します。
      成功時や同日チェックイン済み時は、同じ操作を押し直せない状態にする思想です。
    */
    async function saveCheckinToAppsScriptApi() {
      if (!currentCustomerCode) {
        setStatus('LINE userId を取得してからチェックインしてください。', true);
        appendLog('保存中止: currentCustomerCode が空です。');
        return;
      }

      if (APPS_SCRIPT_API_URL === 'APPS_SCRIPT_API_URL') {
        setStatus('Apps Script API URLを設定してください。', true);
        appendLog('保存中止: APPS_SCRIPT_API_URL が仮置きのままです。');
        return;
      }

      checkinButton.disabled = true;
      setStatus('保存中');

      const payload = createCheckinPayload();

      appendLog('API saveCheckin 開始');
      appendLog('payload customer_code: ' + maskUserId(payload.customer_code));
      appendLog('payload action: ' + payload.action);
      appendLog('payload benefit_status: ' + payload.benefit_status);
      appendLog('payload checkin_id: ' + payload.checkin_id);

      try {
        const response = await jsonpRequest(APPS_SCRIPT_API_URL, {
          api: 'saveCheckin',
          payload: JSON.stringify(payload)
        }, 10000);

        appendLog('response.ok: ' + displayValue(response.ok));
        appendLog('response.code: ' + displayValue(response.code));
        appendLog('response.message: ' + displayValue(response.message));

        if (response.ok === true) {
          setStatus('保存成功');
          checkinNote.textContent = 'チェックイン保存に成功しました。';
          return;
        }

        if (response.code === 'ALREADY_CHECKED_IN_TODAY') {
          setStatus('本日はすでにチェックイン済みです', true);
          checkinNote.textContent = 'サーバー側の同日重複防止により、今日の再チェックインは保存されません。';
          return;
        }

        setStatus(response.message || '保存に失敗しました。', true);
        checkinButton.disabled = false;
      } catch (error) {
        setStatus('保存に失敗しました。', true);
        appendLog('API saveCheckin 失敗: ' + displayValue(error.message));
        checkinButton.disabled = false;
      }
    }

    checkinButton.addEventListener('click', saveCheckinToAppsScriptApi);

    initializeLiffOnlyTest();
  </script>
</body>
